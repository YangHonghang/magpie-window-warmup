# 推送 main 即校验并发包：版本号 npm 上还没有才发布，没改版本的推送只跑校验。
# 发布走 npm Trusted Publishing（GitHub OIDC），仓库里不存任何 npm token；
# npmjs.com 上该包的 Trusted Publisher 必须指向本仓库的 publish.yml。
# 社区仓库 magpie-community/plugins 的 registry.json 只登记包名，magpie 自己从 npm 取最新版，
# 所以发版无需同步社区仓库；只有名称、图标、简介变了才去那边提 PR。
name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      # dist/ 入库、宿主直接加载它：源码改了却没重新构建，发出去的包就是旧代码
      - name: dist 与源码一致
        run: |
          bun run build
          git diff --exit-code -- dist || { echo "::error::dist/ 未随源码重新构建，先 bun run build 再提交"; exit 1; }

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing 用 OIDC 换取一次性发布凭据
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 需要 npm >= 11.5.1，Node 24 自带
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 版本是否已发布
        id: ver
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version 已在 npm 上，跳过发布"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 发布到 npm
        if: steps.ver.outputs.publish == 'true'
        run: npm publish --access public
